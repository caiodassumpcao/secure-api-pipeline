name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately — see [SECURITY.md](../blob/main/SECURITY.md).
        Do not paste secrets, tokens or personal data in this issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up -d
        2. curl -i localhost:3000/...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js and Docker versions, how you run the API.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact anything sensitive before pasting.
      render: shell
