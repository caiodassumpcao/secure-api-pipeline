name: dast

# OWASP ZAP API scan of the running stack (ADR-0007), authenticated as a
# workspace member seeded with synthetic data. Alerts go to code scanning;
# High alerts block.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCAN: docker compose -f .github/scanners/compose.yaml --project-directory . run --rm

jobs:
  # Required check: runs on every pull request and always reports. The scan is
  # skipped when nothing the API serves changed; pushes to main always scan.
  zap:
    name: zap
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      # dorny/paths-filter lists the files of the pull request through the API.
      pull-requests: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect API changes
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            api:
              - 'src/**'
              - 'drizzle/**'
              - 'Dockerfile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'compose.yaml'
              - 'scripts/seed.ts'
              - 'scripts/zap-report.ts'
              - '.zap/**'
              - '.github/scanners/**'
              - '.github/workflows/dast.yml'

      - name: Decide
        id: run
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.changes.outputs.api }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$CHANGED" = true ]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the API serves changed: DAST scan skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: ${{ steps.run.outputs.scan == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Development values; throwaway keys; the stack is discarded at the end.
      - name: Start the stack
        if: ${{ steps.run.outputs.scan == 'true' }}
        run: |
          cp .env.example .env
          node scripts/generate-keys.ts
          chmod 644 keys/jwt-private.pem
          docker compose up --detach --build --wait --wait-timeout 180

      - name: Seed
        id: seed
        if: ${{ steps.run.outputs.scan == 'true' }}
        run: |
          ids="$(node scripts/seed.ts --token-file "$RUNNER_TEMP/zap-token")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Seeded: \`$ids\`" >> "$GITHUB_STEP_SUMMARY"

      # The member's token reaches ZAP through the environment only, as an
      # Authorization header restricted to the API's host. Path parameters
      # take the seeded ids; the scan is throttled under the API's global rate
      # limit (600 requests a minute per IP) and ends before the token expires
      # (15 minutes). Exit codes 1 and 2 only report alerts: the gate below
      # decides.
      - name: Scan
        if: ${{ steps.run.outputs.scan == 'true' }}
        env:
          IDS: ${{ steps.seed.outputs.ids }}
        run: |
          token="$(cat "$RUNNER_TEMP/zap-token")"
          echo "::add-mask::$token"
          export ZAP_AUTH_HEADER=Authorization ZAP_AUTH_HEADER_SITE=127.0.0.1
          export ZAP_AUTH_HEADER_VALUE="Bearer $token"
          options="-config scanner.threadPerHost=1 -config scanner.delayInMs=120"
          options="$options -config scanner.maxScanDurationInMins=10 -config scanner.maxRuleDurationInMins=2"
          index=0
          for name in wsId projectId taskId userId invitationId; do
            value="$(node -e 'process.stdout.write(JSON.parse(process.env.IDS)[process.argv[1]])' "$name")"
            options="$options -config formhandler.fields.field($index).fieldId=$name"
            options="$options -config formhandler.fields.field($index).value=$value"
            options="$options -config formhandler.fields.field($index).enabled=true"
            index=$((index + 1))
          done
          mkdir -p reports/zap
          cp .zap/rules.tsv reports/zap/rules.tsv
          # ZAP runs as uid 1000 inside its image and writes its reports here.
          chmod 777 reports/zap
          status=0
          $SCAN -e ZAP_AUTH_HEADER -e ZAP_AUTH_HEADER_VALUE -e ZAP_AUTH_HEADER_SITE zap \
            zap-api-scan.py -t http://127.0.0.1:3000/openapi.json -f openapi \
            -c rules.tsv -J zap-report.json -r zap-report.html -I -T 15 \
            -z "$options" || status=$?
          if [ "$status" -gt 2 ]; then exit "$status"; fi

      - name: Convert to SARIF
        id: report
        if: ${{ !cancelled() && hashFiles('reports/zap/zap-report.json') != '' }}
        run: |
          status=0
          node scripts/zap-report.ts reports/zap/zap-report.json reports/zap.sarif \
            --ignore .zap/rules.tsv || status=$?
          echo "high=$([ "$status" = 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Upload to code scanning
        if: ${{ !cancelled() && hashFiles('reports/zap.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: reports/zap.sarif
          category: zap

      # Reports describe requests, never their headers; tokens are masked
      # anyway before they are kept.
      - name: Keep the report
        if: ${{ !cancelled() && hashFiles('reports/zap/zap-report.json') != '' }}
        run: |
          sed -i -E \
            -e 's/(bearer )[A-Za-z0-9._~+\/=-]+/\1[REDACTED]/Ig' \
            -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/[REDACTED]/g' \
            reports/zap/zap-report.json reports/zap/zap-report.html

      - name: Upload the report
        if: ${{ !cancelled() && hashFiles('reports/zap/zap-report.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report-${{ github.run_attempt }}
          path: |
            reports/zap/zap-report.json
            reports/zap/zap-report.html
          retention-days: 7

      - name: Show API logs
        if: ${{ failure() && steps.run.outputs.scan == 'true' }}
        run: docker compose logs migrate api

      - name: Stop stack
        if: ${{ always() && steps.run.outputs.scan == 'true' }}
        run: docker compose down --volumes

      - name: Fail on High alerts
        if: ${{ steps.report.outputs.high == 'true' }}
        run: |
          echo '::error::ZAP raised High alerts: see the Security tab and the zap-report artifact.'
          exit 1
