name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: ESLint and Prettier
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: TypeScript
        run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      # Fast feedback without Docker; the coverage gate runs in `integration`.
      - name: Unit tests
        run: pnpm test

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      # Unit, integration and security suites against PostgreSQL started by
      # Testcontainers (same image as compose.yaml). Fails below the coverage
      # thresholds in vitest.config.ts (85 %).
      - name: All test suites with coverage
        run: pnpm test:coverage

      - name: Publish coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const { total } = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
            const rows = ["lines", "statements", "functions", "branches"].map(
              (metric) => `| ${metric} | ${total[metric].pct} % |`,
            );
            const summary = ["### Coverage", "", "| Metric | Covered |", "| --- | --- |", ...rows, ""];
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n"));
          '

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Compile
        run: pnpm build

      # Development values only; the stack is discarded at the end of the job.
      - name: Prepare environment
        run: cp .env.example .env

      # Throwaway key pair for this job. The runner's user is not the image's
      # (uid 1000), so the private key is made readable for the bind mount.
      - name: Generate signing keys
        run: |
          pnpm keys:generate
          chmod 644 keys/jwt-private.pem

      - name: Build image
        run: docker compose build api

      - name: Start stack
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors http://127.0.0.1:3000/health/live
          curl --fail --silent --show-error --retry 5 --retry-all-errors http://127.0.0.1:3000/health/ready
          # Register, log in and call /v1/me: proves the keys reach the container.
          credentials='"email":"smoke@example.test","password":"a passphrase for the stack"'
          curl --fail --silent --show-error http://127.0.0.1:3000/v1/auth/register \
            -H 'content-type: application/json' -d "{$credentials,\"name\":\"Smoke\"}" > /dev/null
          token=$(curl --fail --silent --show-error http://127.0.0.1:3000/v1/auth/login \
            -H 'content-type: application/json' -d "{$credentials}" \
            | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).accessToken)')
          curl --fail --silent --show-error http://127.0.0.1:3000/v1/me -H "authorization: Bearer $token"

      - name: Show logs
        if: ${{ failure() }}
        run: docker compose logs

      - name: Stop stack
        if: ${{ always() }}
        run: docker compose down --volumes

  # Required check: runs on every pull request and always reports. The heavy
  # steps (image build, the observability profile, the smoke test) are skipped
  # when no telemetry, Compose, dashboard or dependency file changed.
  observability:
    name: observability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # dorny/paths-filter lists the files of the pull request through the API.
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect telemetry changes
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            observability:
              - 'src/telemetry/**'
              - 'src/main.ts'
              - 'observability/**'
              - 'scripts/observability-smoke.ts'
              - 'compose.yaml'
              - 'Dockerfile'
              - '.env.example'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

      # Pushes to main always run the whole job.
      - name: Decide
        id: run
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.changes.outputs.observability }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$CHANGED" = true ]; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=false" >> "$GITHUB_OUTPUT"
            echo "No telemetry, Compose or dashboard change: smoke test skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up
        if: ${{ steps.run.outputs.smoke == 'true' }}
        uses: ./.github/actions/setup

      # Development values (every trace kept), the observability profile on,
      # metrics pushed every 5 seconds, and Loki and the collector logging so
      # a failure can be diagnosed.
      - name: Prepare environment
        if: ${{ steps.run.outputs.smoke == 'true' }}
        run: |
          cp .env.example .env
          {
            echo 'COMPOSE_PROFILES=observability'
            echo 'API_OTLP_ENDPOINT=http://otel-lgtm:4318'
            echo 'OTEL_METRIC_EXPORT_INTERVAL=5000'
            echo 'ENABLE_LOGS_LOKI=true'
            echo 'ENABLE_LOGS_OTELCOL=true'
          } >> .env

      - name: Generate signing keys
        if: ${{ steps.run.outputs.smoke == 'true' }}
        run: |
          pnpm keys:generate
          chmod 644 keys/jwt-private.pem

      - name: Build image
        if: ${{ steps.run.outputs.smoke == 'true' }}
        run: docker compose build api

      - name: Start stack with the observability profile
        if: ${{ steps.run.outputs.smoke == 'true' }}
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Smoke test traces, logs, metrics and dashboard
        if: ${{ steps.run.outputs.smoke == 'true' }}
        run: pnpm smoke:observability

      # The API never logs credentials (security suite). Bearer tokens, JWTs
      # and session cookies are masked here anyway, and nothing is kept if one
      # is left.
      - name: Collect logs
        if: ${{ failure() && steps.run.outputs.smoke == 'true' }}
        run: |
          docker compose logs --no-color --timestamps \
            | sed -E \
              -e 's/(bearer )[A-Za-z0-9._~+\/=-]+/\1[REDACTED]/Ig' \
              -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/[REDACTED]/g' \
              -e 's/(__Secure-[A-Za-z-]+=)[^;", ]+/\1[REDACTED]/g' \
              -e 's/("(authorization|cookie|set-cookie)" *: *")[^"]*/\1[REDACTED]/Ig' \
            > compose-logs.txt
          if grep -qiE 'bearer [a-z0-9]|eyJ[A-Za-z0-9_-]{8,}\.|__Secure-[A-Za-z-]+=[^[]' compose-logs.txt; then
            rm compose-logs.txt
            echo '::error::A credential-like value is left in the logs: not kept.'
            exit 1
          fi
          cat compose-logs.txt

      - name: Upload logs
        if: ${{ failure() && steps.run.outputs.smoke == 'true' && hashFiles('compose-logs.txt') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs-${{ github.run_attempt }}
          path: compose-logs.txt
          retention-days: 3

      - name: Stop stack
        if: ${{ always() && steps.run.outputs.smoke == 'true' }}
        run: docker compose down --volumes
