# Local stack: `cp .env.example .env && docker compose up`.
# Grafana, Tempo, Loki and Prometheus too: `docker compose --profile observability up`
# (docs/observability.md). Ports are published on 127.0.0.1 only.
name: secure-api-pipeline

services:
  postgres:
    image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # One-shot: applies migrations, then exits. The API starts only if it succeeded.
  migrate:
    build: .
    image: secure-api-pipeline:local
    command: [node, dist/migrate.js]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # The image HEALTHCHECK probes the API, which this container does not run.
    healthcheck:
      disable: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  api:
    build: .
    image: secure-api-pipeline:local
    environment:
      # Local stack: development mode (production rejects the dev password).
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Access-token signing keys, mounted as secrets (never baked into the image).
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Telemetry. The collector of the observability profile is
      # http://otel-lgtm:4318 (API_OTLP_ENDPOINT in .env); unset, nothing is
      # pushed. /metrics listens on 9464 inside the network, never published.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${API_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}
    secrets:
      - jwt_private_key
      - jwt_public_key
    ports:
      - 127.0.0.1:${API_PORT:-3000}:3000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  # Grafana with Tempo, Loki and Prometheus behind one OTLP endpoint, for
  # development only: Grafana lets anonymous visitors in as admins, and data
  # lives in the container, gone when it is removed.
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.0@sha256:2e3290657f2f2a256c7a9175f097424a3ac5b54840741ace433e108e109348b6
    profiles: [observability]
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
      # OTLP over HTTP, for `pnpm dev` on the host.
      - 127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318
    volumes:
      - ./observability/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/secure-api.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/dashboards/secure-api:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:

# Development key pair from `pnpm keys:generate` (git-ignored). Compose mounts
# the files as they are: the container user (uid 1000) must be able to read them.
secrets:
  jwt_private_key:
    file: ./keys/jwt-private.pem
  jwt_public_key:
    file: ./keys/jwt-public.pem
